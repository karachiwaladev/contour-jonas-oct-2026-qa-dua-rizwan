<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todo</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>Todo</h1>
    <form id="new-task-form" class="new-task" autocomplete="off">
      <div class="row">
        <label for="new-task-input" class="visually-hidden">New task</label>
        <input id="new-task-input" type="text" placeholder="What needs doing?" maxlength="200" required>
        <button type="submit">Add</button>
      </div>
      <div class="row extras">
        <label class="field">
          <span>Due</span>
          <input id="new-task-due" type="date">
        </label>
        <label class="field">
          <span>Repeat</span>
          <select id="new-task-repeat">
            <option value="none">None</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
          </select>
        </label>
        <label class="field">
          <span>Priority</span>
          <select id="new-task-priority">
            <option value="none">None</option>
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </label>
        <label class="field grow">
          <span>Tags</span>
          <input id="new-task-tags" type="text" placeholder="work, urgent" maxlength="200">
        </label>
      </div>
    </form>
    <p id="error" class="error" role="alert" hidden></p>

    <div class="filters" aria-label="Filter tasks">
      <div class="status-filter" role="group" aria-label="Show">
        <button type="button" class="chip" data-status="all" aria-pressed="true">All</button>
        <button type="button" class="chip" data-status="active" aria-pressed="false">Incomplete</button>
        <button type="button" class="chip" data-status="completed" aria-pressed="false">Completed</button>
      </div>
      <div class="select-filters">
        <label class="field priority-filter">
          <span>Priority</span>
          <select id="priority-filter">
            <option value="">All</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
            <option value="none">None</option>
          </select>
        </label>
        <label class="field tag-filter">
          <span>Tag</span>
          <select id="tag-filter">
            <option value="">All tags</option>
          </select>
        </label>
      </div>
    </div>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>
    <p id="empty-state" class="empty">No tasks yet. Add one above.</p>
    <p id="task-count" class="count"></p>
  </main>
  <script src="db.js"></script>
  <script src="app.js"></script>
</body>
</html>
